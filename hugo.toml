baseURL = 'https://forever-funny.github.io/'
title = 'Forever Funny'
defaultContentLanguage = 'zh-cn'
defaultContentLanguageInSubdir = true
enableGitInfo = true
enableRobotsTXT = true

[module]
  [[module.imports]]
    path = 'github.com/imfing/hextra'

# AI / Markdown 可读输出（Hextra 已定义 outputFormats.llms / markdown）
[outputs]
  home = ['html', 'llms']
  page = ['html', 'markdown']
  section = ['html', 'markdown']

[languages.zh-cn]
  label = '中文'
  locale = 'zh-cn'
  weight = 1
  title = 'Forever Funny'
  contentDir = 'content/zh-cn'

[languages.en]
  label = 'English'
  locale = 'en'
  weight = 2
  title = 'Forever Funny'
  contentDir = 'content/en'

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 3

[languages.zh-cn.menu]
  [[languages.zh-cn.menu.main]]
    name = '首页'
    pageRef = '/'
    weight = 1
  [[languages.zh-cn.menu.main]]
    name = '关于'
    pageRef = '/about'
    weight = 2
  [[languages.zh-cn.menu.main]]
    name = '项目'
    pageRef = '/projects'
    weight = 3
  [[languages.zh-cn.menu.main]]
    name = '知识库'
    pageRef = '/docs'
    weight = 4
  [[languages.zh-cn.menu.main]]
    name = '随笔'
    pageRef = '/blog'
    weight = 5
  [[languages.zh-cn.menu.main]]
    name = 'Search'
    weight = 6
    [languages.zh-cn.menu.main.params]
      type = 'search'
  [[languages.zh-cn.menu.main]]
    name = 'GitHub'
    url = 'https://github.com/forever-funny/forever-funny.github.io'
    weight = 7
    [languages.zh-cn.menu.main.params]
      icon = 'github'
  [[languages.zh-cn.menu.main]]
    name = 'Theme'
    weight = 8
    [languages.zh-cn.menu.main.params]
      type = 'theme-toggle'
  [[languages.zh-cn.menu.main]]
    name = 'Language'
    weight = 9
    [languages.zh-cn.menu.main.params]
      type = 'language-switch'

[languages.en.menu]
  [[languages.en.menu.main]]
    name = 'Home'
    pageRef = '/'
    weight = 1
  [[languages.en.menu.main]]
    name = 'About'
    pageRef = '/about'
    weight = 2
  [[languages.en.menu.main]]
    name = 'Projects'
    pageRef = '/projects'
    weight = 3
  [[languages.en.menu.main]]
    name = 'Docs'
    pageRef = '/docs'
    weight = 4
  [[languages.en.menu.main]]
    name = 'Notes'
    pageRef = '/blog'
    weight = 5
  [[languages.en.menu.main]]
    name = 'Search'
    weight = 6
    [languages.en.menu.main.params]
      type = 'search'
  [[languages.en.menu.main]]
    name = 'GitHub'
    url = 'https://github.com/forever-funny/forever-funny.github.io'
    weight = 7
    [languages.en.menu.main.params]
      icon = 'github'
  [[languages.en.menu.main]]
    name = 'Theme'
    weight = 8
    [languages.en.menu.main.params]
      type = 'theme-toggle'
  [[languages.en.menu.main]]
    name = 'Language'
    weight = 9
    [languages.en.menu.main.params]
      type = 'language-switch'

[params]
  [params.navbar]
    displayTitle = true
    displayLogo = true
    width = 'wide'
    [params.navbar.logo]
      path = 'images/logo.svg'
      dark = 'images/logo-dark.svg'
      width = 28
      height = 28
  [params.theme]
    default = 'system'
    displayToggle = true
  [params.footer]
    displayCopyright = true
    displayPoweredBy = false
  [params.editURL]
    enable = true
    base = 'https://github.com/forever-funny/forever-funny.github.io/edit/main/'
  [params.search]
    enable = true
  # 公告条：需要时取消注释
  # [params.banner]
  #   key = 'announcement-1'
  #   message = '站点公告，支持 [Markdown](/zh-cn/docs/) 链接。'
  [params.page]
    displayPagination = true
    [params.page.contextMenu]
      enable = true
  [params.blog]
    [params.blog.list]
      displayTags = true
      pagerSize = 10

[taxonomies]
  tag = 'tags'
