baseURL = 'https://forever-funny.github.io/'
locale = 'zh-cn'
title = 'Forever Funny'
theme = 'hugo-book'
defaultContentLanguage = 'zh-cn'

# Book configuration
disablePathToLower = true
enableGitInfo = true

[frontmatter]
  lastmod = [':git', ':fileModTime', 'lastmod', 'date']

# Needed for mermaid/katex shortcodes
[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 1
  [markup.highlight]
    style = 'base16-snazzy'

[menu]
  [[menu.after]]
    name = 'GitHub'
    url = 'https://github.com/forever-funny/forever-funny.github.io'
    weight = 10

[params]
  BookTheme = 'light'
  BookToC = true
  BookSection = 'docs'
  BookRepo = 'https://github.com/forever-funny/forever-funny.github.io'
  BookSearch = true
  BookComments = false
